<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatBot // Terminal</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .crt {
    width: 460px;
    height: 640px;
    background: #001a00;
    border-radius: 10px;
    border: 3px solid #0f3d0f;
    box-shadow: 0 0 30px rgba(0,255,70,0.35), inset 0 0 60px rgba(0,255,70,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .crt::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15),
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 2;
  }
  .titlebar {
    background: #0f3d0f;
    color: #00ff41;
    padding: 8px 14px;
    font-size: 12px;
    letter-spacing: 2px;
    display: flex;
    justify-content: space-between;
  }
  .terminal {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    color: #00ff41;
    font-size: 13px;
    line-height: 1.6;
    text-shadow: 0 0 4px rgba(0,255,65,0.7);
  }
  .line { margin-bottom: 10px; white-space: pre-wrap; }
  .prompt-user::before { content: "guest@host:~$ "; color: #00cc33; }
  .prompt-bot::before { content: "bot> "; color: #33ff77; opacity: 0.9;}
  .input-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-top: 1px solid #0f3d0f;
    background: #001a00;
  }
  .input-row span {
    color: #00cc33;
    font-size: 13px;
    margin-right: 6px;
  }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #00ff41;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    caret-color: #00ff41;
    text-shadow: 0 0 4px rgba(0,255,65,0.7);
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: #00ff41;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .terminal::-webkit-scrollbar { width: 6px; }
  .terminal::-webkit-scrollbar-thumb { background: #0f3d0f; }
</style>
</head>
<body>

<div class="crt">
  <div class="titlebar">
    <span>CHATBOT.EXE</span>
    <span>[ONLINE]</span>
  </div>
  <div class="terminal" id="messages">
    <div class="line">SYSTEM BOOT COMPLETE. TYPE A MESSAGE BELOW.</div>
    <div class="line prompt-bot">Hello! How can I help you today?</div>
  </div>
  <div class="input-row">
    <span>&gt;</span>
    <input type="text" id="userInput" autocomplete="off">
    <span class="cursor"></span>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  inputEl.focus();

  function addLine(text, cls) {
    const div = document.createElement("div");
    div.className = "line " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addLine(text, "prompt-user");
    inputEl.value = "";

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      addLine(data.reply, "prompt-bot");
    } catch (err) {
      addLine("CONNECTION ERROR: could not reach server.", "prompt-bot");
    }
  }

  inputEl.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });

  document.querySelector(".crt").addEventListener("click", () => inputEl.focus());
</script>

</body>
</html>
